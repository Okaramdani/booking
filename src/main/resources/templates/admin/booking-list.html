<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bookings - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; }
        .sidebar { width: 250px; min-height: 100vh; background: #f8f9fa; padding: 20px; }
        .content { flex: 1; padding: 20px; }
    </style>
</head>
<body>
<div class="sidebar">
    <h4 class="text-primary mb-4">Admin Panel</h4>
    <nav class="nav flex-column">
        <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
        <a class="nav-link" th:href="@{/admin/services}">Manage Services</a>
        <a class="nav-link active" th:href="@{/admin/bookings}">Manage Bookings</a>
        <hr>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="nav-link text-danger btn btn-link">Logout</button>
        </form>
    </nav>
</div>

<div class="content">
    <h2>Manage Bookings</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="card mt-4">
        <div class="card-header">
            <form th:action="@{/admin/bookings}" method="get" class="row g-3 align-items-center">
                <div class="col-auto">
                    <label class="form-label">Filter by Date:</label>
                </div>
                <div class="col-auto">
                    <input type="date" name="tanggal" class="form-control" th:value="${selectedDate}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Filter</button>
                    <a th:href="@{/admin/bookings}" class="btn btn-secondary">Reset</a>
                </div>
            </form>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Service</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="booking : ${bookings}">
                    <td th:text="${booking.id}"></td>
                    <td th:text="${booking.user.nama}"></td>
                    <td th:text="${booking.service.nama}"></td>
                    <td th:text="${booking.tanggal}"></td>
                    <td th:text="${booking.jam}"></td>
                    <td>
                        <span th:if="${booking.status.name() == 'PENDING'}" class="badge bg-warning">PENDING</span>
                        <span th:if="${booking.status.name() == 'APPROVED'}" class="badge bg-success">APPROVED</span>
                        <span th:if="${booking.status.name() == 'CANCELLED'}" class="badge bg-danger">CANCELLED</span>
                    </td>
                    <td>
                        <a th:if="${booking.status.name() == 'PENDING'}"
                           th:href="@{/admin/bookings/approve/} + ${booking.id}"
                           class="btn btn-sm btn-success">Approve</a>
                        <a th:if="${booking.status.name() == 'PENDING'}"
                           th:href="@{/admin/bookings/cancel/} + ${booking.id}"
                           class="btn btn-sm btn-warning">Cancel</a>
                        <a th:href="@{/admin/bookings/delete/} + ${booking.id}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure?')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(bookings)}">
                    <td colspan="7" class="text-center text-muted">No bookings found</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
