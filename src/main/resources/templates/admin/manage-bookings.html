<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Bookings - Smart Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #343a40; }
        .sidebar .nav-link { color: #adb5bd; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: #495057; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3">
                <div class="text-center text-white mb-4">
                    <h4><i class="fas fa-calendar-check"></i> Admin Panel</h4>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/services"><i class="fas fa-concierge-bell"></i> Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/bookings"><i class="fas fa-calendar-alt"></i> Bookings</a>
                    </li>
                    <li class="nav-item">
                         <form th:action="@{/logout}" method="post" class="d-inline">
                             <button type="submit" class="nav-link btn btn-link text-light"><i class="fas fa-sign-out-alt"></i> Logout</button>
                         </form>
                     </li>
                </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 class="mb-4">Manage Bookings</h2>
                
                <form method="get" class="row g-3 mb-4">
                    <div class="col-md-3">
                        <label>Filter by Date</label>
                        <input type="date" name="date" class="form-control" th:value="${date}">
                    </div>
                    <div class="col-md-3">
                        <label>Filter by Status</label>
                        <select name="status" class="form-control">
                            <option value="">All</option>
                            <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${status == st}">Status</option>
                        </select>
                    </div>
                    <div class="col-md-3 align-self-end">
                        <button type="submit" class="btn btn-primary">Filter</button>
                        <a href="/admin/bookings" class="btn btn-secondary">Reset</a>
                    </div>
                </form>
                
                <div class="card">
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Service</th>
                                    <th>Date</th>
                                    <th>Time</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="booking : ${bookings}">
                                    <td th:text="${booking.user.name}">User</td>
                                    <td th:text="${booking.service.name}">Service</td>
                                    <td th:text="${booking.date}">Date</td>
                                    <td th:text="${booking.startTime} + ' - ' + ${booking.endTime}">Time</td>
                                    <td>
                                        <span th:switch="${booking.status}">
                                            <span th:case="PENDING" class="badge bg-warning">Pending</span>
                                            <span th:case="APPROVED" class="badge bg-success">Approved</span>
                                            <span th:case="REJECTED" class="badge bg-danger">Rejected</span>
                                            <span th:case="CANCELLED" class="badge bg-secondary">Cancelled</span>
                                        </span>
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <form th:if="${booking.status == 'PENDING'}" th:action="@{/admin/booking/{id}/approve(id=${booking.id})}" method="post">
                                                <button class="btn btn-success btn-sm"><i class="fas fa-check"></i></button>
                                            </form>
                                            <form th:if="${booking.status == 'PENDING'}" th:action="@{/admin/booking/{id}/reject(id=${booking.id})}" method="post">
                                                <button class="btn btn-danger btn-sm"><i class="fas fa-times"></i></button>
                                            </form>
                                            <form th:action="@{/admin/booking/{id}/cancel(id=${booking.id})}" method="post">
                                                <button class="btn btn-warning btn-sm"><i class="fas fa-ban"></i></button>
                                            </form>
                                            <form th:action="@{/admin/booking/{id}/delete(id=${booking.id})}" method="post">
                                                <button class="btn btn-outline-danger btn-sm" onclick="return confirm('Delete?')"><i class="fas fa-trash"></i></button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
