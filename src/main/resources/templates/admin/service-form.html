<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${serviceId != null} ? 'Edit Service' : 'New Service'">Service Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #343a40; }
        .sidebar .nav-link { color: #adb5bd; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: #495057; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3">
                <div class="text-center text-white mb-4">
                    <h4><i class="fas fa-calendar-check"></i> Admin Panel</h4>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/services"><i class="fas fa-concierge-bell"></i> Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/bookings"><i class="fas fa-calendar-alt"></i> Bookings</a>
                    </li>
                    <li class="nav-item">
                         <form th:action="@{/logout}" method="post" class="d-inline">
                             <button type="submit" class="nav-link btn btn-link text-light"><i class="fas fa-sign-out-alt"></i> Logout</button>
                         </form>
                     </li>
                </ul>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <h2 th:text="${serviceId != null} ? 'Edit Service' : 'New Service'">Service Form</h2>
                
                 <div class="card mt-4">
                     <div class="card-body">
                         <form th:action="${serviceId != null} ? @{/admin/services/{id}(id=${serviceId})} : @{/admin/services}" 
                               th:object="${serviceRequest}" method="post" enctype="multipart/form-data">
                             <div class="mb-3">
                                 <label class="form-label">Service Name</label>
                                 <input type="text" th:field="*{name}" class="form-control" required>
                             </div>
                             <div class="mb-3">
                                 <label class="form-label">Description</label>
                                 <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                             </div>
                             <div class="row">
                                 <div class="col-md-6 mb-3">
                                     <label class="form-label">Category</label>
                                     <select th:field="*{category}" class="form-control" required>
                                         <option value="">Select Category</option>
                                         <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Category</option>
                                     </select>
                                 </div>
                                 <div class="col-md-6 mb-3">
                                     <label class="form-label">Status</label>
                                     <select th:field="*{status}" class="form-control">
                                         <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}">Status</option>
                                     </select>
                                 </div>
                             </div>
                             <div class="row">
                                 <div class="col-md-6 mb-3">
                                     <label class="form-label">Price (Rp)</label>
                                     <input type="number" th:field="*{price}" class="form-control" step="0.01" required>
                                 </div>
                                 <div class="col-md-6 mb-3">
                                     <label class="form-label">Duration (minutes)</label>
                                     <input type="number" th:field="*{duration}" class="form-control" required>
                                 </div>
                             </div>
                             <div class="mb-3" th:if="${serviceRequest.imageUrl != null && !serviceRequest.imageUrl.isEmpty()}">
                                 <label class="form-label">Current Image</label><br>
                                 <img th:src="${serviceRequest.imageUrl}" style="max-height: 200px;" class="img-thumbnail">
                             </div>
                             <div class="mb-3">
                                 <label class="form-label">Upload New Image</label>
                                 <input type="file" name="imageFile" class="form-control" accept="image/*">
                                 <small class="text-muted">Max size: 5MB. Leave empty to keep current image.</small>
                             </div>
                             <button type="submit" class="btn btn-primary">Save</button>
                             <a href="/admin/services" class="btn btn-secondary">Cancel</a>
                         </form>
                     </div>
                 </div>
            </main>
        </div>
    </div>
</body>
</html>
