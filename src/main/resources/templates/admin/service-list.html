<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Services - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; }
        .sidebar { width: 250px; min-height: 100vh; background: #f8f9fa; padding: 20px; }
        .content { flex: 1; padding: 20px; }
    </style>
</head>
<body>
<div class="sidebar">
    <h4 class="text-primary mb-4">Admin Panel</h4>
    <nav class="nav flex-column">
        <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
        <a class="nav-link active" th:href="@{/admin/services}">Manage Services</a>
        <a class="nav-link" th:href="@{/admin/bookings}">Manage Bookings</a>
        <hr>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="nav-link text-danger btn btn-link">Logout</button>
        </form>
    </nav>
</div>

<div class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Services</h2>
        <a th:href="@{/admin/services/add}" class="btn btn-primary">Add New Service</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="card">
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="service : ${services}">
                     <td th:text="${service.id}"></td>
                     <td th:text="${service.name}"></td>
                     <td th:text="${service.description}"></td>
                     <td th:text="'Rp ' + ${service.price}"></td>
                    <td>
                        <span th:if="${service.status.name() == 'AVAILABLE'}" class="badge bg-success">AVAILABLE</span>
                        <span th:if="${service.status.name() == 'UNAVAILABLE'}" class="badge bg-danger">UNAVAILABLE</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/services/edit/{id}(id=${service.id})}" class="btn btn-sm btn-warning">Edit</a>
                         <a th:href="@{/admin/services/delete/{id}(id=${service.id})}"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Are you sure?')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(services)}">
                    <td colspan="6" class="text-center text-muted">No services yet</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
