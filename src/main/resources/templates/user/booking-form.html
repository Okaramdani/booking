<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form - Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Booking System</a>
        <div class="navbar-nav ms-auto">
            <a th:href="@{/user/dashboard}" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Create Booking</h5>
                </div>
                <div class="card-body">
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/user/booking/save}" th:object="${bookingDTO}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nama</label>
                            <input type="text" class="form-control" th:field="*{nama}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tanggal Booking</label>
                            <input type="date" class="form-control" th:field="*{tanggal}"
                                   th:attr="min=${today}" required>
                            <div th:if="${#fields.hasErrors('tanggal')}" class="text-danger" th:errors="*{tanggal}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Jam Booking</label>
                            <input type="time" class="form-control" th:field="*{jam}" required>
                            <div th:if="${#fields.hasErrors('jam')}" class="text-danger" th:errors="*{jam}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Pilih Layanan</label>
                            <select class="form-control" th:field="*{serviceId}" required>
                                <option value="">-- Pilih Layanan --</option>
                                <option th:each="service : ${services}"
                                        th:value="${service.id}"
                                        th:text="${service.nama} + ' - Rp ' + ${service.harga}"></option>
                            </select>
                            <div th:if="${#fields.hasErrors('serviceId')}" class="text-danger" th:errors="*{serviceId}"></div>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Submit Booking</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
