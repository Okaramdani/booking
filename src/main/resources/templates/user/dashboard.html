<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Booking System</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text me-3" th:text="'Welcome, ' + ${user.nama}"></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">Available Services</h5>
                </div>
                <div class="card-body">
                    <div th:each="service : ${services}" class="card mb-2">
                        <div class="card-body">
                            <h6 th:text="${service.nama}"></h6>
                            <p class="small" th:text="${service.deskripsi}"></p>
                            <p class="text-primary fw-bold">Rp <span th:text="${service.harga}"></span></p>
                            <span class="badge bg-success" th:text="${service.status}"></span>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(services)}" class="text-muted">
                        No available services
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">My Bookings</h5>
                    <a th:href="@{/user/booking/create}" class="btn btn-primary btn-sm">New Booking</a>
                </div>
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>Service</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="booking : ${bookings}">
                            <td th:text="${booking.service.nama}"></td>
                            <td th:text="${booking.tanggal}"></td>
                            <td th:text="${booking.jam}"></td>
                            <td>
                                <span th:if="${booking.status.name() == 'PENDING'}" class="badge bg-warning">PENDING</span>
                                <span th:if="${booking.status.name() == 'APPROVED'}" class="badge bg-success">APPROVED</span>
                                <span th:if="${booking.status.name() == 'CANCELLED'}" class="badge bg-danger">CANCELLED</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(bookings)}">
                            <td colspan="4" class="text-center text-muted">No bookings yet</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
