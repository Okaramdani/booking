<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Smart Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 100px 0; }
        .category-card { transition: transform .3s; cursor: pointer; }
        .category-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-calendar-check"></i> Smart Booking</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/services">Services</a>
                <a th:if="${#authorization.expression('isAnonymous()')}" class="nav-link" href="/login">Login</a>
                <a th:if="${#authorization.expression('isAnonymous()')}" class="nav-link" href="/register">Register</a>
                <a th:if="${#authorization.expression('isAuthenticated()')}" class="nav-link" href="/my-bookings">My Bookings</a>
                 <form th:if="${#authorization.expression('isAuthenticated()')}" th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="nav-link btn btn-link text-light">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="hero text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Smart Booking System</h1>
            <p class="lead">Book your favorite services easily - Clinics, Barbershops, Salons & More</p>
        </div>
    </div>

    <div class="container my-5">
        <h2 class="text-center mb-4">Choose Your Service Category</h2>
        <div class="row g-4">
            <div class="col-md-3" th:each="cat : ${categories}">
                <a th:href="@{/services(category=${cat})}" class="text-decoration-none">
                    <div class="card category-card h-100 text-center">
                        <div class="card-body">
                            <i class="fas fa-stethoscope fa-3x text-primary mb-3" th:if="${cat == 'CLINIC'}"></i>
                            <i class="fas fa-cut fa-3x text-primary mb-3" th:if="${cat == 'BARBERSHOP'}"></i>
                            <i class="fas fa-spa fa-3x text-primary mb-3" th:if="${cat == 'SALON'}"></i>
                            <i class="fas fa-door-open fa-3x text-primary mb-3" th:if="${cat == 'ROOM'}"></i>
                            <h5 class="card-title" th:text="${cat}">Category</h5>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
