<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Bookings - Smart Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .badge { font-size: 0.9em; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-calendar-check"></i> Smart Booking</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/services">Services</a>
                <a class="nav-link" href="/my-bookings">My Bookings</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="nav-link btn btn-link text-light">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">My Bookings</h2>
        
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="row g-4">
            <div class="col-md-6" th:each="booking : ${bookings}">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <h5 class="card-title" th:text="${booking.service.name}">Service</h5>
                            <span th:switch="${booking.status}">
                                <span th:case="'PENDING'" class="badge bg-warning">Pending</span>
                                <span th:case="'APPROVED'" class="badge bg-success">Approved</span>
                                <span th:case="'REJECTED'" class="badge bg-danger">Rejected</span>
                                <span th:case="'CANCELLED'" class="badge bg-secondary">Cancelled</span>
                            </span>
                        </div>
                        <p class="text-muted" th:text="${booking.service.category}">Category</p>
                        <p><i class="fas fa-calendar"></i> <span th:text="${booking.date}">Date</span></p>
                        <p><i class="fas fa-clock"></i> <span th:text="${booking.startTime}">Time</span> - <span th:text="${booking.endTime}">End</span></p>
                        <p><i class="fas fa-money-bill"></i> Rp <span th:text="${#numbers.formatDecimal(booking.service.price, 0, 'COMMA', 0, 'POINT')}">0</span></p>
                        <div th:if="${booking.status == 'PENDING'}">
                            <form th:action="@{/bookings/{id}/cancel(id=${booking.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Cancel Booking</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${#lists.isEmpty(bookings)}" class="text-center mt-5">
            <p class="text-muted">No bookings yet. <a href="/services">Browse services</a></p>
        </div>
    </div>
</body>
</html>
