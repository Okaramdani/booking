<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Services - Smart Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .card { transition: transform .3s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-calendar-check"></i> Smart Booking</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/services">Services</a>
                <a th:if="${#authorization.expression('isAuthenticated()')}" class="nav-link" href="/my-bookings">My Bookings</a>
                <a th:if="${#authorization.expression('isAnonymous()')}" class="nav-link" href="/login">Login</a>
                <form th:if="${#authorization.expression('isAuthenticated()')}" th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="nav-link btn btn-link text-light">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">Our Services</h2>
        
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="btn-group" role="group">
                    <a th:href="@{/services}" class="btn btn-outline-primary">All</a>
                    <a th:each="cat : ${categories}" 
                       th:href="@{/services(category=${cat})}" 
                       th:text="${cat}"
                       th:class="${selectedCategory == cat} ? 'btn btn-primary' : 'btn btn-outline-primary'"></a>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-4" th:each="service : ${services}">
                <div class="card h-100">
                    <img th:src="${service.imageUrl ?: 'https://via.placeholder.com/300'}" class="card-img-top" style="height: 200px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${service.name}">Service Name</h5>
                        <p class="card-text" th:text="${service.description}">Description</p>
                        <span class="badge bg-info" th:text="${service.category}">Category</span>
                        <div class="mt-2">
                            <strong>Rp <span th:text="${#numbers.formatDecimal(service.price, 0, 'COMMA', 0, 'POINT')}">0</span></strong>
                            <span class="text-muted" th:text="'• ' + ${service.duration} + ' min'">Duration</span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/services/{id}(id=${service.id})}" class="btn btn-primary w-100">Book Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
